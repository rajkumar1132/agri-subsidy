version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agri-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agri_subsidy_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  server:
    build:
      context: ./server
    container_name: agri-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      # We override the DB URL inside Docker to point to the 'db' container
      - DATABASE_URL=mysql://root:root@db:3306/agri_subsidy_db
      - JWT_SECRET=${JWT_SECRET:-punjab_agri_subsidy_secret_2026_secure_key}
      - PORT=3000
    depends_on:
      - db

  client:
    build:
      context: ./client
    container_name: agri-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  db_data:
